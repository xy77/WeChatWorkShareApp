name: Build APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5
      - name: Build APKs with Gradle
        run: gradle :app:assembleDebug :landrop:assembleDebug
      - name: Rename APKs
        run: |
          mkdir -p release_apks
          cp app/build/outputs/apk/debug/app-debug.apk release_apks/WeChatWorkShare.apk
          cp landrop/build/outputs/apk/debug/landrop-debug.apk release_apks/LanDrop.apk
          ls -lh release_apks/
      - name: Upload WeChatWorkShare APK
        uses: actions/upload-artifact@v4
        with:
          name: WeChatWorkShare
          path: release_apks/WeChatWorkShare.apk
          if-no-files-found: error
      - name: Upload LanDrop APK
        uses: actions/upload-artifact@v4
        with:
          name: LanDrop
          path: release_apks/LanDrop.apk
          if-no-files-found: error
